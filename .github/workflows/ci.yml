name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: Suite completa (bash puro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar suite completa
        run: bash scripts/tests/run-tests.sh --json

      - name: Linter de manifests (--require-all)
        # Gate: TODAS las skills de .agents/skills/ deben tener skill.yaml válido
        # (contrato B2). Falla si alguna skill nueva no trae manifest.
        run: bash scripts/skill-lint.sh --require-all

  doctor:
    name: Doctor — drift vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Baseline de errores conocidos: 0 — el drift (13 MISSING_SKILL) se resolvió
      # el 2026-08-03 creando las skills documentadas en .agents/skills/ + migrando
      # las 3 locales (form-filler, image-analyzer, xiaomi-adb-tricks).
      # El job falla ante CUALQUIER drift nuevo (errors > 0).
      BASELINE_ERRORS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Auditoría buffy-doctor
        run: |
          set -euo pipefail
          OUT="$(bash scripts/buffy-doctor.sh --json 2>/dev/null || true)"
          # Parseo directo: imprime resumen + lista ERR, y falla (exit 1) si el
          # drift supera el baseline. Si el JSON no parsea, python falla → el
          # job falla en voz alta (no hay paso silencioso).
          printf '%s' "$OUT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          errs = [i["message"] for i in d["items"] if i["level"] == "err"]
          print("errors=%d warnings=%d ok=%d" % (d["errors"], d["warnings"], d["ok"]))
          for m in errs:
              print("  ERR: %s" % m)
          baseline = int(sys.argv[1])
          if d["errors"] > baseline:
              sys.stderr.write("::error::Drift aumentó: %d > baseline %d — revisa los MISSING_* nuevos\n" % (d["errors"], baseline))
              sys.exit(1)
          sys.stderr.write("::notice::Doctor: errores=%d (baseline %d) — dentro del baseline\n" % (d["errors"], baseline))
          ' "$BASELINE_ERRORS"
